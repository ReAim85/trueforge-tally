name: tallyforge

services:
  # tally bridge server - connects to desktop agent via websocket
  bridge-server:
    build: ./bridge-server
    ports:
      - '8080:8080'
    environment:
      PORT: 8080
      API_KEY: ${BRIDGE_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

  # tally mcp server - translates mcp tool calls to bridge rest api
  mcp-server:
    build: ./mcp-server
    ports:
      - '3001:3001'
    environment:
      MCP_PORT: 3001
      BRIDGE_URL: http://bridge-server:8080
      BRIDGE_API_KEY: ${BRIDGE_API_KEY}
      BRIDGE_AGENT_ID: ${BRIDGE_AGENT_ID}
    depends_on:
      bridge-server:
        condition: service_healthy
